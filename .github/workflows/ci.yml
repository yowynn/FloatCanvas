name: Windows CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore FloatCanvas.slnx --locked-mode
      - name: Build Release
        run: dotnet build FloatCanvas.slnx --configuration Release --no-restore --nologo
      - name: Verify reviewed Windows publish dependency locks
        run: |
          ./scripts/Test-PublishDependencies.ps1
          dotnet restore src/FloatCanvas.App/FloatCanvas.App.csproj -r win-x64 --locked-mode -p:NuGetLockFilePath=packages.win-x64.lock.json --artifacts-path artifacts/rid-check
      - name: Run default checks without UI or injected input
        run: ./scripts/Test.ps1 -Configuration Release
      - name: Verify both unsigned distribution formats
        run: |
          ./scripts/Publish.ps1 -Configuration Release
          [xml]$project = Get-Content src/FloatCanvas.App/FloatCanvas.App.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          $zip = "dist/FloatCanvas-$version-win-x64.zip"
          ./scripts/Publish-Installer.ps1 -ZipPath $zip
          ./scripts/Test-InstallerRuntime.ps1
          ./scripts/Smoke-Installer.ps1 -ZipPath $zip -SetupPath "dist/FloatCanvas-$version-win-x64-Setup.exe"
          ./scripts/Smoke-Installer.ps1 -ZipPath $zip -SetupPath "dist/FloatCanvas-$version-win-x64-Setup.exe" -Language zhcn
